<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --bg-0: #04060b; --ink: #f4f7fb; --muted: #97a3b6;
        --gw1: rgba(255,248,235,0.95); --gw2: rgba(255,243,224,0.6); --gw3: rgba(255,238,214,0.4); --gw4: rgba(255,235,206,0.22); }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg-0); font-family: "Inter", system-ui, sans-serif; color: var(--ink); }
      .grain { position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay; pointer-events: none; z-index: 40; }

      /* 3D fly-through */
      #stage { position: absolute; inset: 0; overflow: hidden; z-index: 1; perspective: 1100px; perspective-origin: 50% 50%; }
      #world { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
      .card { position: absolute; left: 50%; top: 50%; background-size: cover; background-position: center;
        background-color: #0a0f18; transform-style: flat; will-change: opacity, transform;
        box-shadow: 0 24px 80px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.06); }
      .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,6,11,0.05), rgba(4,6,11,0.4)); }

      /* darkening so words read over the flow */
      #dim { position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, rgba(4,6,11,0.45) 0%, rgba(4,6,11,0.72) 62%, rgba(4,6,11,0.92) 100%); opacity: 0.42; }

      /* warm-white glowing words */
      .word { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; z-index: 3;
        font-weight: 800; font-size: 176px; letter-spacing: -0.02em; color: #fff;
        text-shadow: 0 0 16px var(--gw1), 0 0 42px var(--gw2), 0 0 90px var(--gw3), 0 0 150px var(--gw4); opacity: 0; }

      /* final channel lockup */
      #lockup { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); margin-top: -26px; text-align: center; z-index: 4;
        font-weight: 800; font-size: 108px; letter-spacing: -0.01em; color: #fff;
        text-shadow: 0 0 16px var(--gw1), 0 0 42px var(--gw2), 0 0 90px var(--gw3), 0 0 150px var(--gw4); opacity: 0; }
      #lockup .dot { color: rgba(255,236,210,1); }
      #rule { position: absolute; left: 50%; top: 50%; margin: 70px 0 0 -150px; width: 300px; height: 1px; background: rgba(255,246,232,0.32); transform: scaleX(0); transform-origin: center; z-index: 4; }
      #tag { position: absolute; left: 0; right: 0; top: 50%; margin-top: 100px; text-align: center; z-index: 4;
        font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: 0.42em; font-size: 16px; color: var(--muted); opacity: 0; }
    </style>
  </head>
  <body>
    <div data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="11.5">
      <div id="stage"><div id="world"></div></div>
      <div id="dim"></div>

      <div class="word" id="wPast">Past.</div>
      <div class="word" id="wPresent">Present.</div>
      <div class="word" id="wFuture">Future.</div>

      <div id="lockup">Past<span class="dot">.</span> Present<span class="dot">.</span> Future<span class="dot">.</span></div>
      <div id="rule"></div>
      <div id="tag">Danke fürs Zuschauen</div>

      <div class="grain"><svg width="100%" height="100%"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#gr)"/></svg></div>

      <script>
        window.__timelines = window.__timelines || {};

        // ---- image pool (17 photos with their aspect ratios) ----
        const ASPECT = [1.3504,1.4431,1.5,0.8878,1.9076,0.8011,1.2517,1.5626,1.4908,0.6666,1.7734,1.0,1.3333,2.3908,1.0236,1.503,0.64];
        const IMG = ASPECT.map((_, i) => `../assets/outro/img${String(i + 1).padStart(2, "0")}.jpg`);

        // deterministic RNG so every render is identical
        function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
        const rnd = mulberry32(20260608);
        const rr = (lo, hi) => lo + (hi - lo) * rnd();

        // shuffle image order so neighbours in depth differ
        const order = [...IMG.keys()];
        for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

        // ---- build cards staggered through a deep 3D tunnel ----
        const NUM = 44, STEP = 270, WB = 540;
        const world = document.getElementById("world");
        const CZ = [];                 // each card's base z in world space
        for (let i = 0; i < NUM; i++) {
          const ai = order[i % order.length];
          const asp = ASPECT[ai];
          const w = WB, h = WB / asp;
          const z = -260 - i * STEP + rr(-70, 70);
          // scatter around centre, biased outward; flatten vertically for 16:9
          const ang = rr(0, Math.PI * 2), rad = rr(160, 1180);
          const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad * 0.6;
          const el = document.createElement("div");
          el.className = "card";
          el.style.width = w + "px"; el.style.height = h + "px";
          el.style.marginLeft = -w / 2 + "px"; el.style.marginTop = -h / 2 + "px";
          el.style.backgroundImage = `url('${IMG[ai]}')`;
          el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, ${z.toFixed(1)}px) rotateY(${rr(-13, 13).toFixed(1)}deg) rotateX(${rr(-7, 7).toFixed(1)}deg) rotateZ(${rr(-5, 5).toFixed(1)}deg)`;
          el.style.opacity = "0";
          world.appendChild(el);
          CZ.push(z);
        }
        const cards = Array.from(world.children);

        // opacity vs. distance-to-camera (netz): rise from far, hold, fade as it whooshes past
        function opac(netz) {
          if (netz < -5400) return 0;
          if (netz < -3600) return (netz + 5400) / 1800;
          if (netz < 360) return 1;
          if (netz < 880) return 1 - (netz - 360) / 520;
          return 0;
        }

        const FLY = 8.2, ZT = 12200;
        const tl = gsap.timeline({ paused: true });

        // ---- camera flies forward; one onUpdate drives world depth + every card's opacity ----
        const cam = { z: 0 };
        tl.to(cam, { z: ZT, duration: FLY, ease: "none", onUpdate: () => {
          gsap.set("#world", { z: cam.z });
          for (let i = 0; i < cards.length; i++) cards[i].style.opacity = opac(CZ[i] + cam.z).toFixed(3);
        } }, 0);
        // subtle camera sway + bank for a hand-flown feel
        gsap.set("#world", { z: 0 });
        tl.fromTo("#stage", { perspectiveOrigin: "47% 53%" }, { perspectiveOrigin: "53% 47%", duration: 11.5, ease: "sine.inOut" }, 0);
        tl.fromTo("#world", { rotationZ: -1.2 }, { rotationZ: 1.2, duration: 11.5, ease: "sine.inOut" }, 0);

        // ---- warm-white words, one after another ----
        function showWord(id, at) {
          tl.fromTo(id, { opacity: 0, scale: 1.14, filter: "blur(9px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out", transformOrigin: "center" }, at);
          tl.to(id, { opacity: 0, scale: 0.97, filter: "blur(6px)", duration: 0.55, ease: "power2.in" }, at + 1.6);
          tl.to("#dim", { opacity: 0.66, duration: 0.5, ease: "power2.out" }, at - 0.1);
          tl.to("#dim", { opacity: 0.42, duration: 0.6, ease: "power2.inOut" }, at + 1.7);
        }
        showWord("#wPast", 1.7);
        showWord("#wPresent", 3.7);
        showWord("#wFuture", 5.7);

        // ---- finale: flight dissolves to black, channel lockup ----
        tl.to("#dim", { opacity: 1, duration: 1.1, ease: "power2.inOut" }, 7.4);
        tl.to("#world", { opacity: 0, duration: 1.3, ease: "power2.in" }, 7.6);
        tl.fromTo("#lockup", { opacity: 0, scale: 1.09, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out", transformOrigin: "center" }, 8.2);
        tl.to("#rule", { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 8.9);
        tl.fromTo("#tag", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 9.1);

        window.__timelines["main"] = tl;
      </script>
    </div>
  </body>
</html>
