<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg-0: #070c16; --ink: #f4f7fb; --muted: #8492a8;
        --highlight: #ffd60a; --line: rgba(255,255,255,0.22);
      }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg-0);
        font-family: "Inter", system-ui, sans-serif; color: var(--ink); }
      .mono { font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
      .hid { opacity: 0; }
      .grain { position: absolute; inset: 0; opacity: 0.045; mix-blend-mode: overlay; pointer-events: none; }

      .chrome { position: absolute; inset: 0; font-size: 14px; z-index: 5; }
      .chrome > div { position: absolute; }
      .c-tl { top: 46px; left: 64px; } .c-tr { top: 46px; right: 64px; text-align: right; }
      .c-br { bottom: 46px; right: 64px; text-align: right; }
      .baseline { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
        width: 360px; height: 1px; background: var(--line); transform-origin: center; }

      /* full-frame flex-centered hero text (safe for y/scale anim) */
      .hero { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .hero .big { font-weight: 800; font-size: 132px; letter-spacing: -0.03em; line-height: 0.98; }
      .hero .sub { margin-top: 26px; font-size: 15px; }
      .hl { color: var(--highlight); }

      /* horizontal word-scroll */
      .sword { position: absolute; left: 0; right: 0; top: 50%; text-align: center; font-weight: 800; font-size: 150px; letter-spacing: -0.035em; }

      /* receding timeline (⑥) */
      #recAxis { position: absolute; inset: 0; }
      #recline { position: absolute; left: 150px; right: 150px; top: 62%; height: 2px; transform-origin: right center;
        background: linear-gradient(90deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.45) 65%, rgba(255,255,255,0.85) 100%); }
      .rtick { position: absolute; top: 62%; width: 2px; background: rgba(255,255,255,0.6); }
      #recNow { position: absolute; right: 150px; top: 62%; margin-top: 20px; font-size: 12px; color: var(--ink); text-align: right; transform: translateX(0); }
      #recPast { position: absolute; left: 150px; top: 62%; margin-top: 20px; font-size: 12px; }

      /* invert band (ABER) */
      #band { position: absolute; inset: 0; background: #0a1120; transform: scaleY(0); transform-origin: bottom center; z-index: 20; }
      #band .edge { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--highlight); }
      #bandWord { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 21;
        font-weight: 800; font-size: 150px; letter-spacing: -0.02em; color: var(--highlight); }

      /* ⑦a antique map (real image, unrolls) + real hand */
      #mapStage { position: absolute; inset: 0; }
      #mapWrap { position: absolute; left: 50%; top: 50%; width: 920px; height: 790px; margin: -395px 0 0 -460px; }
      #mapImg { position: absolute; inset: 0; background: #1a130a url('../assets/antique-map-rot.jpg') center/cover;
        clip-path: inset(0% 50% 0% 50%); box-shadow: 0 26px 80px rgba(0,0,0,0.7); }
      .roller { position: absolute; top: -18px; bottom: -18px; width: 32px; border-radius: 16px; left: 444px;
        background: linear-gradient(90deg, #1d150b 0%, #7a5e36 42%, #b89058 51%, #5a4324 70%, #160f07 100%);
        box-shadow: 0 16px 34px rgba(0,0,0,0.65); z-index: 4; }
      .curl { position: absolute; top: 0; bottom: 0; width: 70px; left: 444px; z-index: 3; pointer-events: none; }
      #curlL { background: linear-gradient(90deg, rgba(12,8,3,0.65) 0%, rgba(12,8,3,0) 100%); }
      #curlR { background: linear-gradient(270deg, rgba(12,8,3,0.65) 0%, rgba(12,8,3,0) 100%); }
      #handImg { position: absolute; left: 46%; bottom: -40px; width: 280px; height: 566px; margin-left: -140px;
        background: url('../assets/hand-point.png') center bottom/contain no-repeat; z-index: 5; }
      .ripple { position: absolute; left: 40%; top: 34%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
        border: 2px solid rgba(255,255,255,0.75); border-radius: 50%; z-index: 6; }
      #tapLbl { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; font-size: 14px; }

      /* ⑦b HUD grid */
      #hud { position: absolute; left: 50%; top: 50%; width: 1200px; height: 640px; margin: -320px 0 0 -600px;
        background-image:
          repeating-linear-gradient(0deg, rgba(110,155,216,0.10) 0 1px, transparent 1px 48px),
          repeating-linear-gradient(90deg, rgba(110,155,216,0.10) 0 1px, transparent 1px 48px);
        border: 1px solid rgba(110,155,216,0.18); }
      #hudScan { position: absolute; left: 0; right: 0; height: 2px; top: 0; background: linear-gradient(90deg, transparent, rgba(110,155,216,0.7), transparent); }

      /* ⑧a precision crosshair */
      #cross { position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; margin: -230px 0 0 -230px;
        border: 1.5px solid var(--highlight); border-radius: 50%; }
      #cross::before, #cross::after { content: ""; position: absolute; background: var(--highlight); }
      #cross::before { left: 50%; top: -40px; bottom: -40px; width: 1px; transform: translateX(-50%); }
      #cross::after { top: 50%; left: -40px; right: -40px; height: 1px; transform: translateY(-50%); }

      /* ⑧b question */
      #qcross { position: relative; display: inline-block; color: var(--highlight); }
      #qcross .qc { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
      #qcross .qc::before, #qcross .qc::after { content: ""; position: absolute; }
    </style>
  </head>
  <body>
    <div data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="32.6">
      <div class="grain"><svg width="100%" height="100%"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#gr)"/></svg></div>

      <div class="chrome">
        <div class="c-tl mono">Minab · Iran</div>
        <div class="c-tr mono">KI-Krieg 2.0</div>
        <div class="c-br mono" id="tc">02:11</div>
      </div>
      <div class="baseline" id="baseline"></div>

      <!-- ⑥ Fehler passieren -->
      <div class="sword hid" id="w1">Fehler</div>
      <div class="sword hid" id="w2">passieren</div>
      <div class="hero hid" id="calm6">
        <div class="big">Fehler passieren.</div>
        <div class="sub mono">seit Jahrtausenden</div>
      </div>
      <div id="recAxis" class="hid">
        <div id="recline"></div>
        <div id="recTicks"></div>
        <div id="recNow" class="mono">Heute</div>
        <div id="recPast" class="mono">Jahrtausende</div>
      </div>

      <!-- ⑦a antique map -->
      <div id="mapStage" class="hid">
        <div id="mapWrap">
          <div id="mapImg"></div>
          <div class="curl" id="curlL"></div>
          <div class="curl" id="curlR"></div>
          <div class="roller" id="rollerL"></div>
          <div class="roller" id="rollerR"></div>
          <div class="ripple hid" id="rip1"></div>
          <div class="ripple hid" id="rip2"></div>
          <div id="handImg" class="hid"></div>
        </div>
        <div id="tapLbl" class="mono hid">tippen und hoffen</div>
      </div>

      <!-- ⑦b HUD grid + words -->
      <div id="hud" class="hid"><div id="hudScan" class="hid"></div></div>
      <div class="sword hid" id="w3">technologisch</div>
      <div class="sword hid" id="w4" style="font-size:120px;">fortschrittlichster&nbsp;Krieg</div>

      <!-- ⑦c KI-Krieg -->
      <div class="hero hid" id="kiA"><div class="big">Erster echter</div></div>
      <div class="sword hl hid" id="kiB">KI-Krieg</div>

      <!-- ⑧a Präzision -->
      <div id="cross" class="hid"></div>
      <div class="hero hid" id="praz">
        <div class="big hl">Präzision</div>
        <div class="sub mono">wenn KI die Präzision revolutioniert haben soll</div>
      </div>

      <!-- ⑧b Frage -->
      <div class="hero hid" id="q">
        <div class="big" style="font-size:104px; max-width:1500px;">Wie konnte dann eine <span id="qcross">Schule<span class="qc"></span></span> getroffen werden?</div>
      </div>

      <!-- band invert -->
      <div id="band"><div class="edge"></div></div>
      <div id="bandWord" class="hid">Aber</div>

      <script>
        window.__timelines = window.__timelines || {};
        // receding timeline ticks (⑥) — recent = right/tall/bright, past = left/short/fainter
        (function () {
          const x0 = 150, x1 = 1920 - 150, N = 16;
          let s = "";
          for (let i = 0; i < N; i++) {
            const f = i / (N - 1);
            const x = x1 - f * (x1 - x0);
            const h = 8 + (1 - f) * 18;
            const op = 0.30 + (1 - f) * 0.55;
            s += `<div class="rtick" style="left:${x.toFixed(0)}px;height:${h.toFixed(0)}px;margin-top:-${(h / 2).toFixed(0)}px;opacity:${op.toFixed(2)}"></div>`;
          }
          document.getElementById("recTicks").innerHTML = s;
        })();
        const mapImg = document.getElementById("mapImg");
        const rollerL = document.getElementById("rollerL");
        const rollerR = document.getElementById("rollerR");
        const curlL = document.getElementById("curlL");
        const curlR = document.getElementById("curlR");
        const tl = gsap.timeline({ paused: true });

        // timecode 02:11 -> 02:42
        tl.to({ p: 0 }, { p: 1, duration: 31.6, ease: "none", onUpdate: function () {
          const t = 131.0 + 31.6 * this.targets()[0].p;
          const m = Math.floor(t / 60), s = Math.floor(t % 60);
          document.getElementById("tc").textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
        } }, 0);
        tl.fromTo("#baseline", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.2);
        tl.from(".chrome > div", { opacity: 0, duration: 0.8, stagger: 0.06 }, 0.2);

        // ===== ⑥ Fehler passieren (0–7.7) =====
        tl.fromTo("#w1", { yPercent: -50, x: 640, opacity: 0 }, { yPercent: -50, x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.3);
        tl.to("#w1", { x: -640, opacity: 0, duration: 0.5, ease: "power2.in" }, 2.4);
        tl.fromTo("#w2", { yPercent: -50, x: 640, opacity: 0 }, { yPercent: -50, x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.5);
        tl.to("#w2", { x: -640, opacity: 0, duration: 0.5, ease: "power2.in" }, 3.5);
        tl.fromTo("#calm6", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 3.9);
        tl.set("#recAxis", { opacity: 1 }, 4.2);
        tl.fromTo("#recline", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.out" }, 4.2);
        tl.from(".rtick", { scaleY: 0, opacity: 0, duration: 0.5, stagger: 0.03, ease: "power2.out" }, 4.5);
        tl.from(["#recNow", "#recPast"], { opacity: 0, duration: 0.5, stagger: 0.12 }, 5.1);
        tl.to(["#calm6", "#recAxis"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 7.2);

        // ===== ⑦a ABER + antique map (7.7–12.3) =====
        tl.to("#band", { scaleY: 1, duration: 0.5, ease: "power3.inOut" }, 7.7);
        tl.set("#bandWord", { opacity: 1 }, 8.05);
        tl.fromTo("#bandWord", { scale: 1.1 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 8.05);
        tl.to("#bandWord", { opacity: 0, duration: 0.25 }, 9.0);
        tl.to("#band", { scaleY: 0, transformOrigin: "top center", duration: 0.5, ease: "power3.inOut" }, 9.05);
        // unroll the antique map from the centre; rollers ride the revealing edges
        tl.set("#mapStage", { opacity: 1 }, 9.0);
        const unroll = { v: 50 };
        tl.fromTo(unroll, { v: 50 }, { v: 0, duration: 1.3, ease: "power3.inOut", onUpdate: function () {
          const v = unroll.v;
          mapImg.style.clipPath = `inset(0% ${v}% 0% ${v}%)`;
          const half = 460 * (1 - v / 50);            // revealed half-width 0..460
          rollerL.style.left = (460 - half - 16) + "px";
          rollerR.style.left = (460 + half - 16) + "px";
          curlL.style.left = (460 - half) + "px";
          curlR.style.left = (460 + half - 70) + "px";
        } }, 9.1);
        // old hand reaches in and taps the map
        tl.fromTo("#handImg", { opacity: 0, y: 260 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 10.2);
        tl.to("#handImg", { keyframes: [ { y: -22, duration: 0.18 }, { y: 0, duration: 0.22 }, { y: -22, duration: 0.18 }, { y: 0, duration: 0.22 } ], ease: "power2.inOut" }, 10.95);
        tl.fromTo("#rip1", { scale: 0.3, opacity: 0.9 }, { scale: 4, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 11.05);
        tl.fromTo("#rip2", { scale: 0.3, opacity: 0.9 }, { scale: 4, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 11.4);
        tl.fromTo("#tapLbl", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5 }, 10.9);

        // ===== ⑦b HUD digitalize + words (12.3–17.0) =====
        tl.set("#hud", { opacity: 0 }, 12.3);
        tl.fromTo("#hud", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 12.3);
        tl.set("#hudScan", { opacity: 1 }, 12.3);
        tl.fromTo("#hudScan", { top: "0%" }, { top: "100%", duration: 0.9, ease: "power1.inOut" }, 12.3);
        tl.to("#hudScan", { opacity: 0, duration: 0.2 }, 13.2);
        // map dissolves as it digitalizes
        tl.to(["#mapStage"], { opacity: 0, duration: 0.6, ease: "power2.in" }, 12.4);
        tl.fromTo("#w3", { yPercent: -50, x: 640, opacity: 0 }, { yPercent: -50, x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 12.8);
        tl.to("#w3", { x: -640, opacity: 0, duration: 0.5, ease: "power2.in" }, 13.9);
        tl.fromTo("#w4", { yPercent: -50, x: 640, opacity: 0 }, { yPercent: -50, x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 14.0);
        tl.to("#w4", { opacity: 0, duration: 0.4, ease: "power2.in" }, 16.7);
        tl.to("#hud", { opacity: 0, duration: 0.5, ease: "power2.in" }, 20.9);

        // ===== ⑦c ERSTER ECHTER KI-KRIEG (17.0–21.2) =====
        tl.fromTo("#kiA", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 17.1);
        tl.to("#kiA .big", { y: -90, duration: 0.6, ease: "power3.out" }, 18.1);
        tl.fromTo("#kiB", { yPercent: -50, x: 660, opacity: 0 }, { yPercent: -50, x: 0, opacity: 1, duration: 0.55, ease: "power4.out" }, 18.2);
        tl.set("#kiB", { y: 60 }, 18.2);
        tl.to(["#kiA", "#kiB"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 20.9);

        // ===== ⑧a Präzision + tightening crosshair (21.2–28.3) =====
        tl.fromTo("#cross", { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 2.6, duration: 0.4 }, 21.3);
        tl.to("#cross", { scale: 0.55, duration: 5.6, ease: "power2.inOut" }, 21.7);
        tl.fromTo("#praz", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 21.4);
        tl.to(["#praz", "#cross"], { opacity: 0, duration: 0.45, ease: "power2.in" }, 27.6);

        // ===== ⑧b Schluss-Frage (28.3–32.6) =====
        tl.fromTo("#q", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 28.4);
        tl.to("#baseline", { opacity: 0.4, duration: 1.0 }, 31.0);

        window.__timelines["main"] = tl;
      </script>

      <audio id="vo" data-start="0" data-duration="31.6" data-media-start="131.0" data-track-index="2" src="../audio/voiceover.m4a"></audio>
    </div>
  </body>
</html>
